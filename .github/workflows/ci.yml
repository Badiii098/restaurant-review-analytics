name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Klien web (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test -- --run
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  uji:
    name: Uji dan verifikasi alur
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Jalankan seluruh uji (unit, integrasi, sistem, peramban)
        env:
          PYTHONPATH: src
        run: pytest tests -q --junitxml=reports/pytest.xml

      - name: Buat data contoh
        env:
          PYTHONPATH: src
        run: python -m rra.cli sample-data --n 400

      - name: Jalankan alur end-to-end (SVM)
        env:
          PYTHONPATH: src
        run: python -m rra.cli run

      - name: Evaluasi komponen model
        env:
          PYTHONPATH: src
        run: python -m rra.cli evaluate --folds 3 --out reports/ci_evaluasi.json

      - name: Simpan laporan sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: laporan-py${{ matrix.python-version }}
          path: |
            reports/
            data/processed/
          if-no-files-found: warn
